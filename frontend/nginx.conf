server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The 3D avatar model is large; let browsers cache it
    location ~* \.(glb|js|css|png|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
